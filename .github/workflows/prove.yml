# Le prove di GeppGo, a ogni modifica.
#
# Prima esistevano ma bisognava ricordarsi di lanciarle: funziona finché
# qualcuno se le ricorda, cioè finché non se le dimentica — che è esattamente
# il momento in cui servivano. Da qui in poi girano da sole, e una modifica che
# rompe qualcosa si vede prima di arrivare sul telefono di qualcuno.
#
# Vale doppio con l'app negli store: sul link un errore si corregge in trenta
# secondi, sullo store si aspetta la revisione mentre le recensioni scendono.

name: Prove

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

jobs:
  prove:
    runs-on: ubuntu-latest
    # La batteria intera ci mette circa un'ora su questa macchina (ottobre
    # 2026: la Layout 1 era già a 52 minuti, e la 1b ha aggiunto
    # prova-carattere, che gira le schermate in cinque lingue e due temi).
    # Con 55 le prove venivano fermate a cinque dalla fine, più quelle sul
    # database, e una batteria fermata non dice niente: né verde né rossa.
    timeout-minutes: 80

    # Un Postgres vero per le prove sui permessi: quelle non si possono
    # simulare, perché è proprio il database a decidere chi vede cosa.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: prove
          POSTGRES_DB: geppgo
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      PGHOST: localhost
      PGPORT: '5432'
      PGUSER: postgres
      PGPASSWORD: prove
      PGDATABASE: geppgo
      # Qui una prova saltata conta come una prova andata male: un Postgres
      # configurato storto passerebbe verde senza che i permessi siano mai
      # stati controllati, e non lo si verrebbe a sapere.
      PROVE_TUTTE: '1'

    steps:
      # Con tutta la storia: prova-schermi-grandi (prova 9) confronta le
      # schermate del telefono con quelle dell'ultima versione prima della
      # Layout 3, e quella versione deve esserci.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Installa le dipendenze delle prove
        run: npm install --no-audit --no-fund

      # Il browser con cui si aprono davvero le schermate dell'app. --with-deps
      # tira su anche le librerie di sistema che gli servono, che su una
      # macchina appena creata non ci sono.
      - name: Installa Chromium
        run: npx playwright install --with-deps chromium

      - name: psql, per le prove sul database
        run: sudo apt-get install -y --no-install-recommends postgresql-client

      - name: Le prove
        run: npm test

  # La copia che va online, senza commenti (test/fai-il-sito.js, Layout 3):
  # le stesse prove dell'app, sulla copia invece che sul file di lavoro. Il
  # comportamento deve essere identico, e l'unico modo di saperlo è provarla.
  # Gira accanto all'altro lavoro, quindi non allunga l'attesa. Le prove sul
  # database non c'entrano con la copia e restano di là; Postgres serve lo
  # stesso, perché due prove dell'app (cloud-personale e pdf-calendario)
  # controllano anche i permessi veri.
  copia:
    runs-on: ubuntu-latest
    timeout-minutes: 80
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: prove
          POSTGRES_DB: geppgo
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      PGHOST: localhost
      PGPORT: '5432'
      PGUSER: postgres
      PGPASSWORD: prove
      PGDATABASE: geppgo
      PROVE_TUTTE: '1'
    steps:
      # Con tutta la storia: prova-schermi-grandi (prova 9) confronta le
      # schermate del telefono con quelle dell'ultima versione prima della
      # Layout 3, e quella versione deve esserci.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Installa le dipendenze delle prove
        run: npm install --no-audit --no-fund

      - name: Installa Chromium
        run: npx playwright install --with-deps chromium

      - name: psql, per le prove sul database
        run: sudo apt-get install -y --no-install-recommends postgresql-client

      - name: Fa la copia senza commenti
        run: npm run sito

      - name: Le prove dell'app, sulla copia
        run: APP_URL="file://$GITHUB_WORKSPACE/_site/Index%202.1.html" node test/tutte.js --solo-app
