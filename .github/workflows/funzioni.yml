# Le funzioni su Supabase, pubblicate da sole: le due del ponte della mappa,
# quella che apre i link corti di Google Maps e quella del calendario che si
# aggiorna.
#
# PERCHE' NON A MANO. Pubblicarle dal terminale vuol dire avere un computer
# davanti, ricordarsi il comando e ricordarsi di lanciarlo — e la volta che ci
# si dimentica è quella in cui il codice nel repo e quello che gira sul server
# dicono due cose diverse. Che è il guasto peggiore di tutti, perché si cerca
# nel posto sbagliato.
#
# Da qui in poi: si tocca un file dentro supabase/functions e la funzione
# pubblicata si aggiorna da sola. Oppure si preme "Run workflow", che si fa
# anche dal telefono.
#
# COSA SERVE, UNA VOLTA SOLA: un segreto chiamato SUPABASE_ACCESS_TOKEN nelle
# impostazioni del repo (Settings → Secrets and variables → Actions). Si
# genera su supabase.com, in Account → Access Tokens. Sta lì e non entra mai
# nel codice: chi legge il repo non lo vede.
#
# La chiave di servizio del database NON è qui e non ci deve stare: dentro le
# funzioni Supabase ce la mette da sola.

name: Funzioni

on:
  push:
    branches: [main]
    paths:
      - 'supabase/functions/**'
      - '.github/workflows/funzioni.yml'
  workflow_dispatch:

jobs:
  pubblica:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Installa la CLI di Supabase
        uses: supabase/setup-cli@v1
        with:
          version: latest

      # Il numero del progetto non è un segreto: sta già dentro l'app, in
      # chiaro, perché il telefono deve sapere a chi parlare. Il segreto è il
      # token qui sotto, che è la cosa con cui si pubblica.
      - name: Pubblica «vicini» — le ricerche qui intorno
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: supabase functions deploy vicini --project-ref cyolhqndurgwbivxcssf

      - name: Pubblica «geo» — gli indirizzi e gli alberghi
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: supabase functions deploy geo --project-ref cyolhqndurgwbivxcssf

      # Segue i rimandi dei link corti (maps.app.goo.gl) solo dentro Google
      # Maps: le regole stanno in supabase/functions/link-mappe/regole.mjs.
      - name: Pubblica «link-mappe» — i link corti di Google Maps
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: supabase functions deploy link-mappe --project-ref cyolhqndurgwbivxcssf

      # Il calendario del telefono non manda nessuna chiave: questa si
      # pubblica senza il controllo del token (--no-verify-jwt), e la
      # protezione e' il codice lungo dentro il link. Le regole stanno in
      # supabase/functions/calendario/regole.mjs.
      - name: Pubblica «calendario» — il calendario che si aggiorna
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: supabase functions deploy calendario --project-ref cyolhqndurgwbivxcssf --no-verify-jwt

      - name: Dì com'è andata
        run: |
          echo "Fatto. Per controllare che rispondano, il comando curl sta in"
          echo "supabase/functions/COME-SI-ACCENDE.md — la prima volta risponde"
          echo '"da":"overpass", dalla seconda "da":"memoria".'
