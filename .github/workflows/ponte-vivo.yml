# Il ponte risponde? — si chiede da qui, anche dal telefono.
#
# PERCHE' SERVE. Il ponte e' l'unico pezzo di GeppGo che non sta dentro
# l'app: gira su Supabase, e dall'app non si vede se e' su o giu'. Quando una
# ricerca non trova niente la domanda e' sempre la stessa — «e' il ponte che
# non risponde, o non c'e' davvero niente li' intorno?» — e senza un modo di
# chiederlo si tira a indovinare, che e' il peggior modo di cercare un guasto.
#
# COME SI USA. Actions → «Il ponte risponde?» → Run workflow. Si fa dal
# telefono, come per pubblicare le funzioni. Alla fine c'e' scritto in
# italiano com'e' andata.
#
# PERCHE' NON STA DENTRO «prove». Le prove non devono parlare col servizio
# vero: risponde il mondo e non il caso che si voleva provare, cambia da
# un'ora all'altra, e una prova che dipende dalla rete diventa rossa per
# colpa di qualcun altro. Questo invece PARLA apposta col servizio vero, e
# percio' si lancia a mano quando serve saperlo.
#
# Niente segreti qui dentro: la chiave anonima e' pubblica per come e' fatta
# — sta gia' dentro l'app, in chiaro, perche' il telefono deve poterla usare
# — e si legge dall'app invece di riscriverla, cosi' non puo' divergere.

name: Il ponte risponde?

on:
  workflow_dispatch:

jobs:
  chiedi:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # LE FONTI PRIMA DI TUTTO: e' la misura che serve a scegliere, e deve
      # arrivare prima che il resto del controllo consumi le richieste di
      # questa connessione verso i server della mappa.
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Le dipendenze (per le fonti)
        run: npm install --no-audit --no-fund
      - name: Il browser (per le fonti)
        run: npx playwright install --with-deps chromium
      - name: Le fonti del qui intorno, voce per voce
        run: node test/fonti-dal-vivo.js

      - name: Chiedi al ponte
        run: |
          python3 - <<'FINE'
          import json, re, time, urllib.request, urllib.error, urllib.parse

          sorgente = open('Index 2.1.html', encoding='utf-8').read()
          # Il primo che compare e' la casella vuota di partenza: si vuole
          # quello vero, che e' l'ultimo assegnato in chiaro.
          def ultimo(nome):
              v = [x for x in re.findall(r'window\.' + nome + r'\s*=\s*"([^"]*)"', sorgente) if x]
              return v[-1] if v else ''

          base = ultimo('GEPPGO_SUPA_URL').rstrip('/')
          chiave = ultimo('GEPPGO_SUPA_KEY')
          if not base or not chiave:
              print("Nell'app non c'e' scritto a quale ponte parlare. Niente da chiedere.")
              raise SystemExit(1)
          print('Ponte:', base.split('//')[-1])
          print()

          def chiedi(strada, corpo):
              richiesta = urllib.request.Request(
                  base + '/functions/v1/' + strada,
                  data=json.dumps(corpo).encode(),
                  headers={'Content-Type': 'application/json',
                           'apikey': chiave, 'Authorization': 'Bearer ' + chiave})
              via = time.time()
              try:
                  with urllib.request.urlopen(richiesta, timeout=60) as r:
                      return json.loads(r.read().decode()), time.time() - via, None
              except urllib.error.HTTPError as e:
                  return None, time.time() - via, str(e.code) + ' ' + e.read().decode()[:200]
              except Exception as e:
                  return None, time.time() - via, str(e)

          guai = 0

          # ── le ricerche qui intorno ──────────────────────────────────
          # Una domanda della stessa forma di quelle dell'app, su una piazza
          # dove i bancomat ci sono di sicuro: se non torna niente, il guasto
          # e' nostro e non della mappa.
          q = ('[out:json][timeout:20];('
               'nwr["amenity"="atm"](around:1500,45.464,9.190);'
               'nwr["amenity"="bank"](around:1500,45.464,9.190);'
               ');out center 150;')
          d, quanto, guaio = chiedi('vicini', {'q': q})
          print('— le ricerche qui intorno (bancomat in Duomo, Milano)')
          if guaio:
              print('  NON RISPONDE:', guaio); guai += 1
          # PRIMA `ancora`, POI `errore`: una risposta "sto ancora cercando"
          # porta dentro anche il motivo, quindi ha tutti e due i campi. Con
          # l'ordine al contrario la si scambiava per un guasto - ed e'
          # successo, al primo lancio.
          elif d.get('ancora'):
              # Non e' un guasto: la mappa arranca e il ponte sta cercando in
              # sottofondo. Fra un minuto la stessa domanda risponde dalla
              # memoria - e se non lo fa, allora si' che c'e' un guaio.
              print('  sta ancora cercando (%s). Aspetto e richiedo...' % d.get('errore', ''))
              time.sleep(50)
              d, quanto, guaio = chiedi('vicini', {'q': q})
          elif d.get('errore'):
              print('  risponde, ma dice di no:', d['errore']); guai += 1
          if not guaio and d is not None and not d.get('errore') and not d.get('ancora'):
              quanti = len(d.get('elements') or [])
              print('  risponde in %.1fs, da «%s», %d posti trovati' % (quanto, d.get('da', '?'), quanti))
              # QUANDO OVERPASS NON CE LA FA, RISPONDE 200 CON LA LISTA VUOTA
              # e il motivo dentro `remark`. Senza guardarlo, "non ce l'ho
              # fatta" si legge come "non c'e' niente" - che e' la bugia
              # peggiore che questa app possa dire.
              if d.get('remark'):
                  print('  ATTENZIONE, Overpass dice: ' + str(d['remark'])[:200]); guai += 1
              elif quanti == 0:
                  print('  ma a zero posti in Duomo qualcosa non torna.')
                  print('  risposta grezza: ' + json.dumps(d)[:300]); guai += 1
          elif not guaio and d is not None and d.get('ancora'):
              print('  dopo quaranta secondi sta ancora cercando: ' + str(d.get('errore'))[:120]); guai += 1

          # ── gli indirizzi ────────────────────────────────────────────
          print()
          print('— gli indirizzi e gli alberghi (Colosseo)')
          u = 'https://nominatim.openstreetmap.org/search?q=Colosseo&format=json&limit=1'
          d, quanto, guaio = chiedi('geo', {'url': u})
          if guaio:
              print('  NON RISPONDE:', guaio); guai += 1
          elif d.get('errore'):
              print('  risponde, ma dice di no:', d['errore']); guai += 1
          else:
              dati = d.get('dati') or []
              nome = (dati[0].get('display_name', '') if dati else '')[:60]
              print('  risponde in %.1fs, da «%s»: %s' % (quanto, d.get('da', '?'), nome or 'niente'))
              if not nome:
                  print('  ma il Colosseo si trova sempre: qualcosa non torna.'); guai += 1

          # ── e i server della mappa, uno per uno ──────────────────────
          # SERVE PERCHE' UNO PUO' MENTIRE BENE. Un server con il database
          # vuoto risponde 200, senza nessun errore, con la lista vuota:
          # "qui non c'e' niente" detto con la faccia seria. E' la risposta
          # peggiore che si possa ricevere, perche' e' indistinguibile da
          # quella giusta - a meno di guardare `timestamp_osm_base`, che in
          # una risposta sana e' una data recente.
          print()
          print('— i server della mappa, uno per uno (stessa domanda)')
          # Quelli che l'app usa davvero si leggono DALL'APP, cosi' questa
          # lista non puo' divergere da quella vera.
          # `dict.fromkeys` e non `set`: l'ordine conta, perche' e' l'ordine
          # in cui l'app li chiede — e chi e' primo vince le corse.
          IN_USO = list(dict.fromkeys(re.findall(r"'(https://[^']*interpreter)'", sorgente)))
          # E dei CANDIDATI, che l'app non usa: si guarda come rispondono
          # prima di fidarsi. E' il contrario di come erano entrati osm.ch e
          # osm.jp — messi nella lista perche' esistevano, non perche' erano
          # stati controllati, e uno dei due rispondeva il falso.
          CANDIDATI = [
              'https://overpass.osm.jp/api/interpreter',
              'https://overpass.osm.ch/api/interpreter',
              'https://overpass.openstreetmap.ru/api/interpreter',
          ]
          inUso = True
          for s in IN_USO + ['CANDIDATI'] + CANDIDATI:
              if s == 'CANDIDATI':
                  inUso = False
                  print('  — e questi l\'app NON li usa: si guarda come stanno —')
                  continue
              casa = s.split('/')[2]
              richiesta = urllib.request.Request(
                  s, data=('data=' + urllib.parse.quote(q)).encode(),
                  headers={'Content-Type': 'application/x-www-form-urlencoded',
                           'User-Agent': 'GeppGo/1.0 (controllo; merati.giacomo94@gmail.com)'})
              via = time.time()
              try:
                  with urllib.request.urlopen(richiesta, timeout=40) as rr:
                      dd = json.loads(rr.read().decode())
                  quando = (dd.get('osm3s') or {}).get('timestamp_osm_base', '?')
                  n = len(dd.get('elements') or [])
                  nota = ''
                  if not re.match(r'^\d{4}-\d{2}-\d{2}T', str(quando)):
                      nota = '  ← NON È UNA DATA: database vuoto o rotto'
                      # Un candidato che mente non e' un guaio nostro: e' il
                      # motivo per cui lo si guarda prima di adottarlo.
                      if inUso: guai += 1
                  elif n == 0:
                      nota = '  ← zero in Duomo, non torna'
                  elif not inUso:
                      nota = '  ← risponde bene: si puo\' valutare'
                  # E QUANTO SONO VECCHI I DATI. Non e' un guasto — un
                  # bancomat di due mesi fa e' quasi sempre ancora li' — ma
                  # e' il motivo per cui un posto aperto ad agosto non si
                  # trova, e senza guardarlo si cercherebbe nel posto
                  # sbagliato.
                  try:
                      eta = (time.time() - time.mktime(time.strptime(str(quando)[:19], '%Y-%m-%dT%H:%M:%S'))) / 86400
                      if eta > 7: nota += '  (dati vecchi di %d giorni)' % eta
                  except Exception:
                      pass
                  print('  %-28s %5.1fs  %4d posti  dati al %s%s' % (casa, time.time() - via, n, quando, nota))
                  if dd.get('remark'):
                      print('      remark: ' + str(dd['remark'])[:140])
              except Exception as e:
                  print('  %-28s  non risponde: %s' % (casa, str(e)[:60]))

          print()
          if guai:
              print('IL PONTE NON STA FACENDO IL SUO LAVORO.')
              print('L\'app continua a funzionare lo stesso — chiama la mappa da sola —')
              print('ma senza la memoria condivisa, e con le chiamate contate a testa.')
              raise SystemExit(1)
          print('Il ponte risponde, tutto a posto.')
          print('La prima volta dice «overpass» o «nominatim», dalla seconda «memoria»:')
          print('vuol dire che la risposta se l\'e\' tenuta da parte per tutti.')
          FINE

      # ── E OGNI VOCE, CON LE DOMANDE CHE FA DAVVERO L'APP ────────────────
      # Il passo sopra fa UNA domanda, scritta a mano, sui bancomat. Quando
      # «funziona solo per stazione e metro» quella domanda non dice niente
      # delle altre voci. Qui le domande le fa l'app — si apre davvero, voce
      # per voce, e se ne catturano tutte — e si mandano al ponte e ai server
      # veri una per una. Serve il browser, per questo i tre passi in piu'.
      # `if: always()`: anche quando il passo sopra trova un guaio. E' proprio
      # quando qualcosa non va che serve sapere com'e' ogni voce.
      - uses: actions/setup-node@v4
        if: always()
        with:
          node-version: '20'
      - name: Le dipendenze
        if: always()
        run: npm install --no-audit --no-fund
      - name: Il browser
        if: always()
        run: npx playwright install --with-deps chromium
      - name: Ogni voce, dal ponte vero
        if: always()
        run: node test/domande-dal-vivo.js

      # E LA COSA PIU' VICINA A UN TELEFONO VERO: l'app aperta senza recinto,
      # il ponte e i server veri, le sei voci toccate in fila dal menu come fa
      # una persona. «Funziona solo per stazione e metro» — che sono le prime
      # due del menu: se il guasto sono le richieste che si esauriscono, qui
      # si vede.
      - name: Le sei voci in fila, come un telefono
        if: always()
        run: node test/come-un-telefono.js
